[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docaudio"
version = "0.1.0"
description = "Conversor local de documentos DOCX e PDF para audio em portugues brasileiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "piper-tts>=1.3",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "kokoro-onnx>=0.4",
    # Gravacao da voz a clonar e player do audiolivro (o PySide6-Essentials nao tem QtMultimedia).
    "sounddevice>=0.4",
    # Decodificadores da aba Player (FFmpeg LGPL embutido): MP3, AAC, FLAC, Ogg, Opus, WMA...
    "av>=14",
    "numpy>=1.24",
    # Traducao offline (modelos Argos/OPUS-MT executados sem PyTorch).
    "ctranslate2>=4.4",
    "sentencepiece>=0.2",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[project.scripts]
docaudio = "docaudio.__main__:main"

[project.gui-scripts]
docaudio-gui = "docaudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
